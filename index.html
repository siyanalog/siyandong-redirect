<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <title>Redirecting...</title>

  <link rel="canonical" href="https://siyanalog.com/">

  <meta
    http-equiv="refresh"
    content="0; url=https://siyanalog.com/"
  >

  <script>
    window.location.replace(
      "https://siyanalog.com" +
      window.location.pathname +
      window.location.search +
      window.location.hash
    );
  </script>
</head>

<body>
  <p>
    Redirecting to
    <a href="https://siyanalog.com/">siyanalog.com</a>...
  </p>
</body>
</html>
